services:
  postgres:
    image: postgres:16-alpine
    container_name: domaingate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: domaingate
      POSTGRES_PASSWORD: domaingate_dev_password
      POSTGRES_DB: domaingate
    ports:
      - "5432:5432"
    volumes:
      - domaingate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domaingate -d domaingate"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  domaingate_pgdata:
